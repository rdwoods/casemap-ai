apply plugin: 'java'
apply plugin: 'war'
apply plugin: 'eclipse-wtp'

// JDK 7
sourceCompatibility = 1.7
targetCompatibility = 1.7


repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compile group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
    compile("org.springframework:spring-context:4.3.3.RELEASE")
    compile("org.springframework:spring-webmvc:4.3.3.RELEASE")
    compile group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.8.3'
    compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.8.3'
    compile group: 'org.springframework.data', name: 'spring-data-mongodb', version: '1.9.4.RELEASE'



//    compile("javax.inject:javax.inject:1")
//    compile("javax.servlet:servlet-api:2.5")
//    compile("javax.servlet:jstl:2.5")
//    compile("javax.servlet.jsp:jsp-api:1.2")
//    compile("org.slf4j:slf4j-api:1.7.5")
//    compile("org.slf4j:jcl-over-slf4j:1.7.5")
//    compile("org.slf4j:slf4j-log4j12:1.7.5")
//    compile("log4j:log4j:1.2.15")

    testCompile("junit:junit:4.7")
}


sourceSets {
    main {
        java {
            srcDirs = ['src/java']
        }
    }

    test {
        java {
            srcDirs = ['src/java']
        }
    }
}